version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-shop
    container_name: laravel-shop-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel-shop

  nginx:
    image: nginx:alpine
    container_name: laravel-shop-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - laravel-shop

  mysql:
    image: mysql:8.0
    container_name: laravel-shop-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: shop
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: shop
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel-shop

  redis:
    image: redis:alpine
    container_name: laravel-shop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laravel-shop

networks:
  laravel-shop:
    driver: bridge

volumes:
  mysql-data:
    driver: local